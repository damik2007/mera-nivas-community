server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page app: serve index.html for any unmatched route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: reverse-proxy /api to the backend container when both sit
    # behind the same nginx (adjust VITE_API_URL to "/api" if you use this).
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
